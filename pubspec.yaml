name: rotamobil
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  http: ^1.6.0
  intl: ^0.20.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  geolocator: ^13.0.2
  firebase_core: ^4.12.0
  firebase_messaging: ^16.4.2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

dependency_overrides:
  path_provider_android: 2.2.15
  firebase_core_platform_interface: 8.0.0