<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px; height: 500px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .banner {
    width: 1024px; height: 500px;
    position: relative;
    background: linear-gradient(135deg, #0A1628 0%, #0D47A1 100%);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 0 72px;
  }
  .circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }
  .c1 { width: 420px; height: 420px; top: -160px; right: -120px; }
  .c2 { width: 300px; height: 300px; bottom: -140px; right: 180px; background: rgba(83,214,255,0.08); }
  .c3 { width: 180px; height: 180px; bottom: -60px; left: 60px; background: rgba(255,255,255,0.03); }
  .content { position: relative; z-index: 2; display: flex; align-items: center; gap: 40px; }
  .logo {
    width: 168px; height: 168px;
    border-radius: 40px;
    background-image: url('../assets/icon/app_icon.png');
    background-size: cover;
    background-position: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .text h1 {
    color: #FFFFFF;
    font-size: 76px;
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 12px;
  }
  .text p {
    color: rgba(255,255,255,0.7);
    font-size: 28px;
    font-weight: 500;
  }
  .badge {
    position: absolute;
    right: 72px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 2;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px;
    padding: 14px 22px;
    color: white;
    font-size: 20px;
    font-weight: 600;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #53D6FF; }
</style>
</head>
<body>
  <div class="banner">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
    <div class="content">
      <div class="logo"></div>
      <div class="text">
        <h1>Rota360</h1>
        <p>Trafik Bilgili Rota Planlama</p>
      </div>
    </div>
    <div class="badge">
      <div class="pill"><div class="dot"></div>En Kısa Rota</div>
      <div class="pill"><div class="dot"></div>Canlı Trafik</div>
      <div class="pill"><div class="dot"></div>Ücretsiz</div>
    </div>
  </div>
</body>
</html>
